<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&C Tracker — Вход</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-box">

    <div class="login-logo">📊 S&C Tracker</div>
    <p class="login-sub">Отслеживание акций и криптовалют</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" id="loginForm">
      <label class="login-label" for="loginInput">Имя пользователя</label>
      <input
        class="login-input"
        type="text"
        id="loginInput"
        name="login"
        placeholder="Введите логин"
        maxlength="30"
        autocomplete="off"
        autofocus
        required
      >
      <p class="login-hint">Только буквы (русские или латинские), без цифр и пробелов. Максимум 30 символов.</p>

      <div class="error-msg" id="jsError" style="display:none;"></div>

      <button class="login-btn" type="submit">Войти</button>
    </form>

  </div>
</div>

<script>
  /* Применить сохранённую тему до рендера */
  if (localStorage.getItem('sc_theme') === 'dark') {
    document.getElementById('htmlRoot').classList.add('dark');
  }

  /* Клиентская валидация */
  const input  = document.getElementById('loginInput');
  const errEl  = document.getElementById('jsError');
  const VALID  = /^[A-Za-zА-Яа-яЁё]*$/;

  /* Блокировать ввод запрещённых символов в реальном времени */
  input.addEventListener('input', () => {
    const val = input.value;
    if (!VALID.test(val)) {
      input.value = val.replace(/[^A-Za-zА-Яа-яЁё]/g, '');
    }
  });

  document.getElementById('loginForm').addEventListener('submit', e => {
    const val = input.value.trim();
    if (!val) {
      e.preventDefault();
      showErr('Введите логин');
    } else if (val.length > 30) {
      e.preventDefault();
      showErr('Логин не должен превышать 30 символов');
    } else if (!VALID.test(val)) {
      e.preventDefault();
      showErr('Логин может содержать только буквы (русские или латинские)');
    }
  });

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
</script>

</body>
</html>
