<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&C Tracker - Отслеживание акций Московской биржи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Карточки */
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 25px;
            margin-bottom: 30px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            display: inline-block;
        }

        /* Таблица */
        .stocks-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }

        .stocks-table th,
        .stocks-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .stocks-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .stocks-table tr:hover {
            background: #f5f5f5;
        }

        .positive {
            color: #10b981;
            font-weight: bold;
        }

        .negative {
            color: #ef4444;
            font-weight: bold;
        }

        /* Форма расчета прибыли */
        .profit-form {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-calculate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
        }

        .btn-calculate:active {
            transform: translateY(0);
        }

        /* Результат расчета */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result-card.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            display: block;
        }

        .result-card.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            display: block;
        }

        .result-card h3 {
            margin-bottom: 15px;
        }

        .result-card .profit-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
            color: #ffd700;
        }

        .result-card .details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        /* Футер с телефоном */
        .footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .support-phone {
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            transition: transform 0.2s;
        }

        .support-phone:hover {
            transform: scale(1.05);
        }

        .support-phone .phone-icon {
            font-size: 1.2rem;
        }

        .support-phone .phone-number {
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Обновление времени */
        .update-time {
            text-align: right;
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .stocks-table {
                font-size: 0.85rem;
            }

            .stocks-table th,
            .stocks-table td {
                padding: 8px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .profit-value {
                font-size: 1.5rem;
            }
        }

        /* Загрузка */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1> S&C Tracker</h1>
            <p>Система отслеживания акций Московской биржи</p>
        </div>

        <!-- Таблица акций -->
        <div class="card">
            <h2> Текущие котировки</h2>
            <div id="stocks-loading" class="loading">
                <div class="spinner"></div>
                <p>Загрузка данных...</p>
            </div>
            <div id="stocks-table" style="display: none;">
                <table class="stocks-table">
                    <thead>
                        <tr>
                            <th>Компания</th>
                            <th>Цена (₽)</th>
                            <th>Изменение (%)</th>
                            <th>Валюта</th>
                        </tr>
                    </thead>
                    <tbody id="stocks-tbody">
                    </tbody>
                </table>
            </div>
            <div class="update-time" id="update-time"></div>
        </div>

        <!-- Расчет прибыли -->
        <div class="card">
            <h2> Расчет прибыли от инвестиции</h2>
            <div class="profit-form">
                <div class="form-group">
                    <label for="company">Выберите компанию</label>
                    <select id="company" required>
                        <option value="">-- Выберите компанию --</option>
                        {% for company in companies %}
                        <option value="{{ company }}">{{ company }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="purchase-date">Дата покупки (дд.мм.гггг)</label>
                    <input type="text" id="purchase-date" placeholder="например: 01.01.2024" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Количество акций</label>
                    <input type="number" id="quantity" placeholder="например: 100" min="1" required>
                </div>

                <button class="btn-calculate" onclick="calculateProfit()">
                    🔄 Подсчитать прибыль
                </button>

                <div id="result" class="result-card"></div>
            </div>
        </div>
    </div>

    <!-- Телефон поддержки -->
    <div class="footer">
        <a href="tel:+79184162853" class="support-phone">
            <span class="phone-icon">📞</span>
            <span class="phone-number">+7 (918) 416-28-53</span>
        </a>
    </div>

    <script>
        // Загрузка данных с сервера
        async function loadStocksData() {
            try {
                // Получаем данные о компаниях
                const companiesResponse = await fetch('/api/companies');
                const companiesData = await companiesResponse.json();

                // Загружаем данные по каждой компании
                const stocks = [];
                for (const company of companiesData.companies) {
                    const priceResponse = await fetch(`/api/prices/${encodeURIComponent(company)}`);
                    const priceData = await priceResponse.json();
                    if (priceData && priceData.цена) {
                        stocks.push({
                            название: company,
                            цена: priceData.цена,
                            изменение_процент: priceData.изменение_процент || 0,
                            валюта: priceData.валюта || 'RUB'
                        });
                    }
                }

                // Отображаем таблицу
                displayStocksTable(stocks);

                // Обновляем время
                document.getElementById('update-time').innerHTML = `Обновлено: ${new Date().toLocaleString('ru-RU')}`;

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('stocks-loading').innerHTML = '<p>❌ Ошибка загрузки данных. Проверьте соединение с сервером.</p>';
            }
        }

        function displayStocksTable(stocks) {
            const tbody = document.getElementById('stocks-tbody');
            tbody.innerHTML = '';

            stocks.forEach(stock => {
                const row = tbody.insertRow();
                const changeClass = stock.изменение_процент >= 0 ? 'positive' : 'negative';
                const changeSign = stock.изменение_процент >= 0 ? '+' : '';

                row.innerHTML = `
                    <td>${stock.название}</td>
                    <td>${stock.цена.toFixed(2)}</td>
                    <td class="${changeClass}">${changeSign}${stock.изменение_процент.toFixed(2)}%</td>
                    <td>${stock.валюта}</td>
                `;
            });

            // Скрываем загрузку, показываем таблицу
            document.getElementById('stocks-loading').style.display = 'none';
            document.getElementById('stocks-table').style.display = 'block';
        }

        async function calculateProfit() {
            const company = document.getElementById('company').value;
            const date = document.getElementById('purchase-date').value;
            const quantity = document.getElementById('quantity').value;
            const resultDiv = document.getElementById('result');

            // Проверка ввода
            if (!company) {
                showResult('error', 'Пожалуйста, выберите компанию');
                return;
            }

            if (!date) {
                showResult('error', 'Пожалуйста, укажите дату покупки');
                return;
            }

            if (!quantity || quantity <= 0) {
                showResult('error', 'Пожалуйста, укажите корректное количество акций');
                return;
            }

            // Проверка формата даты
            const dateRegex = /^(\d{2})\.(\d{2})\.(\d{4})$/;
            if (!dateRegex.test(date)) {
                showResult('error', 'Дата должна быть в формате дд.мм.гггг (например, 01.01.2024)');
                return;
            }

            // Показываем загрузку
            resultDiv.innerHTML = '<div class="spinner" style="margin:20px auto;"></div><p style="text-align:center">Расчет...</p>';
            resultDiv.className = 'result-card';

            try {
                const response = await fetch(`/api/calculate?company=${encodeURIComponent(company)}&date=${encodeURIComponent(date)}&quantity=${encodeURIComponent(quantity)}`);
                const data = await response.json();

                if (data.success) {
                    const profitSign = data.profit >= 0 ? '+' : '';
                    const profitClass = data.profit >= 0 ? 'positive' : 'negative';

                    resultDiv.innerHTML = `
                        <h3>📊 Результат расчета</h3>
                        <div class="profit-value ${profitClass}">${profitSign}${data.profit.toFixed(2)} ₽</div>
                        <div>${profitSign}${data.profit_percent.toFixed(2)}% от начальной суммы</div>
                        <div class="details">
                            <div>📈 Компания: <strong>${data.company}</strong></div>
                            <div>📅 Дата покупки: <strong>${data.purchase_date}</strong></div>
                            <div>🎯 Количество акций: <strong>${data.quantity} шт.</strong></div>
                            <div>💰 Цена покупки: <strong>${data.purchase_price.toFixed(2)} ₽</strong></div>
                            <div>💵 Текущая цена: <strong>${data.current_price.toFixed(2)} ₽</strong></div>
                            <div>💸 Стоимость покупки: <strong>${data.total_cost.toFixed(2)} ₽</strong></div>
                            <div>💹 Текущая стоимость: <strong>${data.total_current.toFixed(2)} ₽</strong></div>
                        </div>
                    `;
                    resultDiv.className = 'result-card success';
                } else {
                    showResult('error', data.error);
                }
            } catch (error) {
                console.error('Ошибка расчета:', error);
                showResult('error', 'Ошибка соединения с сервером. Попробуйте позже.');
            }
        }

        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<p>${type === 'error' ? '❌' : '✅'} ${message}</p>`;
            resultDiv.className = `result-card ${type}`;
        }

        // Автообновление данных каждые 60 секунд
        setInterval(loadStocksData, 60000);

        // Загрузка данных при открытии страницы
        loadStocksData();
    </script>
</body>
</html>
